########################
### GENERAL SETTINGS ###
########################
set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
# set -g default-command "reattach-to-user-namespace -l zsh"
set -sa terminal-overrides ",xterm*:Tc"

# enable mouse support
set -g mouse on

# copy-paste
setw -g mode-keys vi

# enable viewing images in terminal
set -gq allow-passthrough on
set -g visual-activity off

###################
### STATUS LINE ###
###################
# cendre · dark medium · https://cendretheme.com (upstream extras/tmux file)
source-file ~/.config/tmux/cendre-medium.tmux.conf
# lines below re-assert personal layout over the theme file's defaults
set -g status-left-length 100
set -g status-right-length 200
# hw meters, one cendre pigment each (stock cendre shows only a git branch,
# which is dropped here): sap battery · frost RAM · ember CPU · potassium GPU
set -g status-right "#[fg=#99af6b]#(~/.config/tmux/scripts/battery.sh)  "
set -ag status-right "#[fg=#4e89a2]#(~/.config/tmux/scripts/ram_info.sh)  "
set -ag status-right "#[fg=#ea9875]#(~/.config/tmux/scripts/cpu_info.sh)  "
set -ag status-right "#[fg=#9480ba]#(~/.config/tmux/scripts/gpu_usage.sh)"

set-option -g status-position top
set-option -g automatic-rename off
set-option -g allow-rename off

####################
### KEY BINDINGS ###
####################
# rebind CTRL-b to CTRL-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# reload tmux config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# create a binding for creating a new session
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"

# create a binding for killing a session
bind K confirm kill-session

# rebind horizontal pane splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"

# rebind vertical pane splitting
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# resize panes
bind -r j resize-pane -D 5  # resize downward
bind -r k resize-pane -U 5  # resize upward
bind -r l resize-pane -R 5  # resize rightward
bind -r h resize-pane -L 5  # resize leftward
bind -r m resize-pane -Z    # maximize pane

bind , command-prompt -I "#W" "rename-window '%%'"
bind . command-prompt "move-window -t '%%'"

#########################
### PANES AND WINDOWS ###
#########################
# renumber windows automatically
set-option -g renumber-windows on

# start window and pane indices at 1
set -g base-index 1
setw -g pane-base-index 1

###############
### PLUGINS ###
###############
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-dir "$HOME/.tmux/resurrect/"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"


run "~/.tmux/plugins/tpm/tpm"
