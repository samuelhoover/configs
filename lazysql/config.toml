[[database]]
Name = 'MLflow remote tracking server database'
Provider = 'postgres'
DBName = 'mlflowdb'
URL = 'postgres://${user}:urlencodedpassword@localhost:${port}/foo'
ReadOnly = false
Commands = [
  { Command = 'ssh -tt remote-bastion -L ${port}:localhost:5432', WaitForPort = '${port}' },
  { Command = 'whoami', SaveOutputTo = 'user' },
]
